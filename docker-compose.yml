name: charitychain

services:
  postgres:
    image: postgres:17-alpine
    container_name: charitychain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-charitychain}
      POSTGRES_USER: ${POSTGRES_USER:-charitychain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charitychain-local-only}
    ports:
      - "5433:5432"
    volumes:
      - charitychain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-charitychain} -d ${POSTGRES_DB:-charitychain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ipfs:
    image: ipfs/kubo:v0.39.0
    container_name: charitychain-ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - charitychain_ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 10

  bootstrap:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-charitychain}:${POSTGRES_PASSWORD:-charitychain-local-only}@postgres:5432/${POSTGRES_DB:-charitychain}?schema=public
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npm run migrate:deploy -w @charitychain/database && npm run seed -w @charitychain/database"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: charitychain-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-charitychain}:${POSTGRES_PASSWORD:-charitychain-local-only}@postgres:5432/${POSTGRES_DB:-charitychain}?schema=public
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://ipfs:8080
      APP_URL: http://localhost:5173
      API_URL: http://localhost:3000
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: charitychain-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: infrastructure/docker/simulator.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-charitychain}:${POSTGRES_PASSWORD:-charitychain-local-only}@postgres:5432/${POSTGRES_DB:-charitychain}?schema=public
    env_file:
      - .env
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

volumes:
  charitychain_postgres_data:
  charitychain_ipfs_data:
